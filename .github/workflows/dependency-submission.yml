name: Dependency Graph

# Submits the resolved Gradle dependency graph on every push to main so Dependabot
# alerts track what main actually resolves, not a stale snapshot.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions: read-all

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to submit the dependency snapshot
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
