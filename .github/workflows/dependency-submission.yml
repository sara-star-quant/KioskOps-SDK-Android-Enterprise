name: Dependency Graph

# Submits the resolved Gradle dependency graph on every push to main so Dependabot
# alerts track what main actually resolves, not a stale snapshot.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions: read-all

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to submit the dependency snapshot
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
