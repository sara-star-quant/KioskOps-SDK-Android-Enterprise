name: Fuzz

on:
  push:
    branches: [ "main" ]
    paths:
      - 'kiosk-ops-sdk/src/**'
      - '.github/workflows/fuzz.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'kiosk-ops-sdk/src/**'
  schedule:
    - cron: '0 3 * * 0'  # Weekly on Sunday at 3 AM
  workflow_dispatch:

permissions: read-all

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run fuzz tests
        run: ./gradlew :kiosk-ops-sdk:fuzzTest --no-daemon
        env:
          JAZZER_FUZZ: "1"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.0
        with:
          name: fuzz-crashes
          path: |
            **/crash-*
            **/Crash_*.java
          retention-days: 30
