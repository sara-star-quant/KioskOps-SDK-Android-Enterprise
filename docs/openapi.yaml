openapi: 3.0.3
info:
  title: KioskOps Events Ingest API
  version: 1.0.0
  description: |
    Batch ingest endpoint for the KioskOps SDK.

    Key properties:
      - Idempotency per event: (id, idempotencyKey)
      - Client sends JSON payloads; server should validate per type
      - Server returns per-event acknowledgements
servers:
  - url: https://example.your-company.tld/
paths:
  /events/batch:
    post:
      summary: Ingest a batch of operational events
      parameters:
        - in: header
          name: X-KioskOps-Signature-Version
          required: false
          schema:
            type: string
          description: Optional request signing version ("1") when HMAC request signing is enabled.
        - in: header
          name: X-KioskOps-Timestamp
          required: false
          schema:
            type: string
          description: Optional UNIX epoch seconds used for replay protection.
        - in: header
          name: X-KioskOps-Nonce
          required: false
          schema:
            type: string
          description: Optional nonce (UUID recommended) used for replay protection.
        - in: header
          name: X-KioskOps-Key-Id
          required: false
          schema:
            type: string
          description: Optional key id to support server-side key rotation.
        - in: header
          name: X-KioskOps-Signature
          required: false
          schema:
            type: string
          description: Optional signature string (e.g. "hmac-sha256:<base64url>") over the canonical request string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchSendRequest'
      responses:
        '200':
          description: Batch processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSendResponse'
        '400':
          description: Validation error (client should treat as permanent for that event)
        '401':
          description: Unauthorized (client will retry after host refreshes auth)
        '403':
          description: Forbidden
        '429':
          description: Rate limited (retry)
        '500':
          description: Server error (retry)
components:
  schemas:
    TransportEvent:
      type: object
      required: [id, idempotencyKey, type, payloadJson, createdAtEpochMs]
      properties:
        id:
          type: string
          description: Client event id (UUID recommended)
        idempotencyKey:
          type: string
          description: Client idempotency key (UUID recommended)
        type:
          type: string
        payloadJson:
          type: string
          description: JSON string (server validates per type)
        createdAtEpochMs:
          type: integer
          format: int64
    BatchSendRequest:
      type: object
      required: [batchId, deviceId, appVersion, locationId, sentAtEpochMs, events]
      properties:
        batchId:
          type: string
        deviceId:
          type: string
          description: Pseudonymous device identifier (stable per install)
        appVersion:
          type: string
        locationId:
          type: string
        sentAtEpochMs:
          type: integer
          format: int64
        events:
          type: array
          items:
            $ref: '#/components/schemas/TransportEvent'
        auditCheckpoint:
          $ref: '#/components/schemas/AuditCheckpoint'
    AuditCheckpoint:
      type: object
      description: >-
        Snapshot of the device audit chain head. Sent only when SecurityPolicy.signedAuditCheckpoints
        is on; absent otherwise. On first contact the server pins it. After that the server checks each
        checkpoint against its pin and pins it when Consistent.
        R1: same chainGeneration, headSeq and eventCount not below the pin, else Regressed.
        R2: (linkSeq, linkHash) equals the pinned (headSeq, headHash) or the previous pin's, else Forked
        (a null link while a pin exists is Forked). The server keeps the last two pins, because a response
        lost after the server pinned leaves the device linking to the previous pin.
        R3: when prunedThroughSeq is above the pinned headSeq, Forked unless the device audit retention
        window has passed since the pin was received; after it, a link at prunedThroughSeq must carry
        prunedThroughHash and any other link re-baselines the pin on trust.
        Limits: events after the last acknowledged checkpoint, devices that never sync, attackers with code
        execution on the device or the signing key, and device clock honesty are out of reach of these rules.
      required: [headSeq, headHash, eventCount, chainGeneration, prunedThroughSeq, prunedThroughHash]
      properties:
        headSeq:
          type: integer
          format: int64
          description: Seq of the newest stored audit event; equals prunedThroughSeq when every event was pruned.
        headHash:
          type: string
          description: Hash of the event at headSeq (base64url SHA-256); GENESIS for an empty chain.
        eventCount:
          type: integer
          format: int64
          description: Audit events ever recorded in this chain, pruned events included. Never decreases.
        chainGeneration:
          type: integer
          format: int32
          description: Generation of the device audit chain. A change means a new chain, not a continuation.
        prunedThroughSeq:
          type: integer
          format: int64
          description: Highest seq removed by retention; 0 when retention never pruned.
        prunedThroughHash:
          type: string
          description: Hash of the event at prunedThroughSeq; GENESIS when retention never pruned.
        linkSeq:
          type: integer
          format: int64
          description: >-
            headSeq of the last checkpoint this server acknowledged with a successful batch response. Absent
            before the first acknowledgement.
        linkHash:
          type: string
          description: >-
            Hash the device database holds at linkSeq when this checkpoint was built; prunedThroughHash when
            retention pruned exactly through linkSeq. Absent when linkSeq is absent or the row at linkSeq is
            gone for any other reason.
        signature:
          type: string
          description: >-
            Base64 ECDSA P-256 (SHA256withECDSA) signature by the device audit key over the UTF-8 bytes of
            "kioskops-audit-checkpoint-v1|" followed by headSeq, headHash, eventCount, chainGeneration,
            prunedThroughSeq, prunedThroughHash, linkSeq and linkHash, each written as
            "<utf8 byte length>:<value>" with no separator; an absent linkSeq or linkHash is written as "-".
            This API defines no endpoint to enroll the device public key; until the host delivers the key
            (for example its Keystore attestation chain) by another channel, treat the signature as
            unauthenticated. Absent when the device could not sign; the device then records a
            checkpoint_unsigned audit event.
    EventAck:
      type: object
      required: [id, idempotencyKey, accepted, retryable]
      properties:
        id:
          type: string
        idempotencyKey:
          type: string
        accepted:
          type: boolean
        retryable:
          type: boolean
          description: When false, client should stop retrying this event
        error:
          type: string
          nullable: true
        serverEventId:
          type: string
          nullable: true
    BatchSendResponse:
      type: object
      required: [acceptedCount, acks]
      properties:
        acceptedCount:
          type: integer
        acks:
          type: array
          items:
            $ref: '#/components/schemas/EventAck'
